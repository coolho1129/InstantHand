# InstantHand stage 1: avatar predictor (geometry and base colors)
#   accelerate launch --num_processes 4 train_stage1.py --cfg configs/train_stage1.yaml
#   overrides: --set optim.batch_size=4 --set data.root=/path/to/train   resume: --resume_dir <step dir>
# Values reproduce the released stage-1 training (4 GPUs); the released weights are exps/neurips2026/stage1_best.

seed: 42
mixed_precision: bf16           # "no" | fp16 | bf16

output:
  save_dir: ./exps/stage1               # step_XXXXXXX/ with model.safetensors (+ optimizer state for --resume_dir)
  tb_dir: ./exps/stage1/tensorboard
  ckpt_every: 500               # optimizer steps
  log_every: 10
  tqdm_every: 10
  ema_beta: 0.98                # progress-bar smoothing

optim:
  epochs: 10
  steps_per_epoch: 2000         # optimizer steps
  batch_size: 6                 # per GPU
  accum_steps: 2
  lr: 3.0e-4
  weight_decay: 0.05
  betas: [0.9, 0.95]
  clip_grad: 1.0
  scheduler:                    # cosine warm-up -> hold -> cosine decay to min_lr_ratio * lr
    warmup_steps: 2000
    hold_steps: 10000
    decay_steps: 8000
    min_lr_ratio: 0.1

loss:
  lambda_rgb: 1.0               # masked L1 + lambda_lpips * LPIPS
  lambda_lpips: 0.2
  lambda_silhouette: 0.6        # L1 between rendered alpha and silhouette
  lambda_offset: 0.1            # L2 on Gaussian offsets
  lambda_lap: 10000.0           # Laplacian smoothness of Gaussian offsets
  lambda_scale: 0.75            # hinge on Gaussian scales above scale_reg_thresh
  scale_reg_thresh: 0.004
  soft_alpha_band:              # SAB (outer band / inner core, weight ramped in over ramp_start..ramp_end)
    lambda_alpha_out: 0.25
    lambda_alpha_in: 0.05
    r_out: 2
    r_core: 2
    tau_out: 0.03
    tau_in: 0.60
    beta_out: 0.03
    beta_in: 0.05
    ramp_start: 5000
    ramp_end: 12000

data_config: configs/train_data.yaml   # root, dataset settings, `policies.stage1`; override with --set data.<key>=...

model:                          # ModelHAM
  mano_model_path: ./instanthand/models/rendering/mano_model/
  encoder_type: dinov3_fusion
  encoder_model_name: dinov3_vitl16
  encoder_weights_path: ./instanthand/models/encoders/dinov3/weights/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  encoder_feat_dim: 1024
  encoder_freeze: true
  encoder_grad_ckpt: false
  transformer_type: sd3_cond
  transformer_dim: 512
  transformer_layers: 2
  transformer_heads: 8
  tf_grad_ckpt: false
  pcl_dim: 512
  num_pcl: 1024
  latent_query_points_type: e2e_mano
  mano_subdivide_num: 3
  gs_use_rgb: true
  gs_sh: 3
  gs_mlp_network_config: {n_neurons: 512, n_hidden_layers: 2, activation: silu}
  gs_xyz_offset_max_step: 0.008
  gs_clip_scaling: 0.008
  scale_sphere: true
  fix_opacity: true
  fix_rotation: true
  use_appearance_head: false
  appearance_head_cfg: null
