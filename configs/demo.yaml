# InstantHand demo (python demo.py --ids all). Camera and video settings reproduce the
# supplementary videos: fixed 30 deg FOV, MANO-frame camera (back of the hand = +y, fingers = -x),
# bounding-sphere framing at fill 0.8, pose-bank wrist rotations kept, 256 px.

device: cuda
ckpt_dir: ./exps/neurips2026/stage2_best          # model.safetensors
input_root: ./demo/input                           # rgba/<id>.png + json/<id>.json
out_dir: ./demo/output
pose_bank: ./demo/pose_bank/anim_pose.npy

# ---- model (must match the checkpoint and configs/eval_hanco.yaml) ----
model:
  mano_model_path: ./instanthand/models/rendering/mano_model/

  # image encoder
  encoder_type: dinov3_fusion
  encoder_model_name: dinov3_vitl16
  encoder_weights_path: ./instanthand/models/encoders/dinov3/weights/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  encoder_feat_dim: 1024
  encoder_freeze: true
  encoder_grad_ckpt: false

  # transformer
  transformer_type: sd3_cond
  transformer_dim: 512
  transformer_layers: 2
  transformer_heads: 8
  tf_grad_ckpt: false
  pcl_dim: 512
  num_pcl: 1024

  # canonical Gaussians on the subdivided MANO mesh
  latent_query_points_type: e2e_mano
  mano_subdivide_num: 3
  gs_use_rgb: true
  gs_sh: 3
  gs_mlp_network_config:
    n_neurons: 512
    n_hidden_layers: 2
    activation: silu
  gs_xyz_offset_max_step: 0.001
  gs_clip_scaling: 0.008
  scale_sphere: true
  fix_opacity: true
  fix_rotation: true

  # appearance transfer head
  use_appearance_head: true
  appearance_head_cfg:
    hidden_dim: 384
    num_heads: 8
    basis_size: 64
    source_encoder_feat_dim: 64
    evidence_dropout_prob: 0.1
    observed_mask_threshold: 0.5
    dino_feat_dim: 1024
    identity_delta_scale: 0.1
    global_gate_init_bias: -1.5

preprocess:
  image_res: 256
  multiply: 16
  bg_value: 0.0
  kp_enlarge: 1.3
  alpha_thr: 0.5
  border_feather: 6          # px fade where the mask touches the image border

camera:
  fov_deg: 30.0
  fill: 0.8                  # sphere: bounding radius spans this fraction of the frame height
  # pose_fill: 0.8           # optional: fill for the pose animation only (default: fill)
  fit: sphere                # sphere (supplementary) | tight (hand fills `fill` of the frame at its widest)
  dist: 0.0                  # > 0: fixed distance
  canonical_orientation: axes    # axes (supplementary) | anatomical (from this hand's joints)
  pose_orientation: axes
  dorsal_axis: "+y"          # MANO-frame axis out of the back of the hand (supplementary setting)
  finger_axis: "-x"          # MANO-frame axis along the fingers = image up
  start_side: auto           # anatomical only: auto | dorsal | palmar

videos:
  kinds: [canonical, pose]
  res: 0                     # 0: network resolution (256, supplementary); e.g. 512 for larger videos
  fps: 30
  # turntables
  orbit_axes: [yaw, pitch]
  n_orbit: 120
  yaw_deg: 360.0
  pitch_deg: 90.0
  orbit_pose: rest           # rest | source (the input finger pose)
  # pose animation: 44 poses x (0.5 s hold + 0.5 s transition) = 1320 frames
  pose_global: bank          # bank (supplementary: keep the wrist rotations) | rest (fingers only)
  pose_ids: null
  pose_max: -1
  pose_view_degs: [0, 45, 90]    # views used in the supplementary gallery; all: [-90, -45, 0, 45, 90]
  pose_layout: separate      # separate | hstack
  pose_hold_sec: 0.5
  pose_transition_sec: 0.5
  pose_loop: true
  pose_fit_frames: 120       # tight fit only
  save_frames: false

# ---- optional post-processing (not used in the paper) ----
postprocess:
  seam_blend: False          # true (or --seam_blend): blend the color step where input-colored and
                             # prior-completed Gaussians meet
  seam_blend_mm: 3.0         # half-width of the blend band in mm

# ---- optional k=4 densification (Appendix, Table S10; not used for the main results) ----
densify:
  k4: false                  # true (or --k4): interpolate the k=3 avatar onto the k=4 anchors (4x Gaussians)
  scale: 0.6                 # all scales multiplied by this (0.6: supplementary video, Fig. S11)