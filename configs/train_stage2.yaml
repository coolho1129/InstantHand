# InstantHand stage 2: appearance head on the frozen stage-1 model
#   accelerate launch --num_processes 4 train_stage2.py --cfg configs/train_stage2.yaml
#   overrides: --set stage1_ckpt_dir=... --set optim.batch_size=2   resume: --resume_dir <step dir>
# Values reproduce the released stage-2 training (4 GPUs); the released weights are exps/neurips2026/stage2_best.

seed: 42
mixed_precision: bf16           # "no" | fp16 | bf16

stage1_ckpt_dir: ./exps/neurips2026/stage1_best   # released stage-1 weights; your own run: ./exps/stage1/step_0020000

output:
  save_dir: ./exps/stage2               # step_XXXXXXX/ with model.safetensors: evaluate with --ckpt_dir ./exps/stage2/step_XXXXXXX
  tb_dir: ./exps/stage2/tensorboard
  ckpt_every: 500
  log_every: 10
  tqdm_every: 10
  ema_beta: 0.98

optim:
  epochs: 10
  steps_per_epoch: 2000
  batch_size: 4                 # per GPU
  accum_steps: 1
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]
  clip_grad: 1.0
  scheduler:
    warmup_steps: 2000
    hold_steps: 10000
    decay_steps: 8000
    min_lr_ratio: 0.2

loss:                           # masked L1 + LPIPS on the source view (self) and on the novel views
  lambda_self_l1: 1.0
  lambda_self_lpips: 0.5
  lambda_self_feat_stats: 0.05  # image-encoder feature statistics, self view vs source; no gradient (logged only), 0 skips it
  lambda_novel_l1: 1.0
  lambda_novel_lpips: 0.25

data:
  root: ./data/train
  datasets: null
  num_workers: 4
  dataset:
    subject_sampling: uniform_subject
    render_image_res: 256
    source_image_res: 256
    render_multiply: 16
    source_multiply: 16
    kp_enlarge: 1.3
    force_center_pp: true
    adjust_cam_t_when_force_center: true
    use_photometric_aug: false  # keep the source colors intact for appearance transfer
  policies:
    PALM:          {dataset_weight: 0.35, source_stride: 1,  num_targets: 6, num_self_targets: 1, num_same_group_targets: 1, num_cross_group_targets: 4, allow_cross_group: true}
    InterHand2.6M: {dataset_weight: 0.30, source_stride: 1,  num_targets: 6, num_self_targets: 1, num_same_group_targets: 2, num_cross_group_targets: 3, allow_cross_group: true}
    Synthetic:     {dataset_weight: 0.15, source_stride: 1,  num_targets: 6, num_self_targets: 1, num_same_group_targets: 1, num_cross_group_targets: 4, allow_cross_group: true}
    Goliath:       {dataset_weight: 0.08, source_stride: 5,  num_targets: 6, num_self_targets: 1, num_same_group_targets: 5, num_cross_group_targets: 0, allow_cross_group: false}
    HARP:          {dataset_weight: 0.04, source_stride: 5,  num_targets: 6, num_self_targets: 1, num_same_group_targets: 5, num_cross_group_targets: 0, allow_cross_group: false}
    HO3D_v3:       {dataset_weight: 0.08, source_stride: 10, num_targets: 6, num_self_targets: 1, num_same_group_targets: 3, num_cross_group_targets: 2, allow_cross_group: true}

model:
  mano_model_path: ./instanthand/models/rendering/mano_model/
  encoder_type: dinov3_fusion
  encoder_model_name: dinov3_vitl16
  encoder_weights_path: ./instanthand/models/encoders/dinov3/weights/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  encoder_feat_dim: 1024
  encoder_freeze: true
  encoder_grad_ckpt: false
  transformer_type: sd3_cond
  transformer_dim: 512
  transformer_layers: 2
  transformer_heads: 8
  tf_grad_ckpt: false
  pcl_dim: 512
  num_pcl: 1024
  latent_query_points_type: e2e_mano
  mano_subdivide_num: 3
  gs_use_rgb: true
  gs_sh: 3
  gs_mlp_network_config: {n_neurons: 512, n_hidden_layers: 2, activation: silu}
  gs_xyz_offset_max_step: 0.008
  gs_clip_scaling: 0.008
  scale_sphere: true
  fix_opacity: true
  fix_rotation: true
  use_appearance_head: true
  appearance_head_cfg:
    hidden_dim: 384
    num_heads: 8
    basis_size: 64
    source_encoder_feat_dim: 64
    evidence_dropout_prob: 0.1
    observed_mask_threshold: 0.5
    dino_feat_dim: 1024
    identity_delta_scale: 0.1
    global_gate_init_bias: -1.5
